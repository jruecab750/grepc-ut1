var idx = 0;
function $(id){ return document.getElementById(id); }
function pintar(){
  var s=SLIDES[idx];
  $("mgrcmp_titulo").innerHTML = (idx+1)+". "+s.titulo;
  $("mgrcmp_cuerpo").innerHTML = s.cuerpo;
  $("mgrcmp_cuerpo").scrollTop = 0;
  $("mgrcmp_ra").innerHTML = "🎯 <strong>Conexión con el RA1:</strong> "+s.ra;
  if(s.img){
    $("mgrcmp_img").src=s.img; $("mgrcmp_img").style.display="block";
    $("mgrcmp_panel").style.display="none";
  } else {
    $("mgrcmp_img").style.display="none";
    $("mgrcmp_panel").innerHTML=s.panel||""; $("mgrcmp_panel").style.display="block";
  }
  $("mgrcmp_prev").disabled = (idx===0);
  $("mgrcmp_next").disabled = (idx===SLIDES.length-1);
  $("mgrcmp_contador").textContent = "Diapositiva "+(idx+1)+" de "+SLIDES.length;
  var puntos=$("mgrcmp_puntos").children;
  for(var i=0;i<puntos.length;i++){ puntos[i].className="mgrcmp-punto"+(i===idx?" mgrcmp-activo":""); }
}
function ir(n){ idx=Math.max(0,Math.min(SLIDES.length-1,n)); pintar(); }
function init(){
  var cont=$("mgrcmp_puntos");
  SLIDES.forEach(function(_,i){
    var b=document.createElement("button");
    b.className="mgrcmp-punto"; b.type="button";
    b.setAttribute("aria-label","Ir a la diapositiva "+(i+1));
    b.addEventListener("click",function(){ ir(i); });
    cont.appendChild(b);
  });
  $("mgrcmp_prev").addEventListener("click",function(){ ir(idx-1); });
  $("mgrcmp_next").addEventListener("click",function(){ ir(idx+1); });
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowLeft") ir(idx-1);
    if(e.key==="ArrowRight") ir(idx+1);
  });
  pintar();
}
if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",init); } else { init(); }
Object.defineProperty(window,"mgrcmpSlide",{get:function(){ return idx; }});
